<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookMyForex UAE</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:#f5f7fb;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            font-family:Arial, Helvetica, sans-serif;
        }

        .banner-container{
            width:100%;
            max-width:1400px;
            padding:20px;
        }

        .banner-container img{
            width:100%;
            height:auto;
            display:block;
            border-radius:12px;
            box-shadow:0 10px 30px rgba(0,0,0,.15);
        }
    </style>
</head>

<body>

<div class="banner-container">
    <img src="banner.jpg" alt="BookMyForex UAE Banner">
</div>

</body>
</html>
